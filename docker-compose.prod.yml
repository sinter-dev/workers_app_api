services:
  app:
    image: ghcr.io/sinter-dev/workers_app_api:${IMAGE_TAG:-latest}
    container_name: workers_app_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - uploads:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads:
    driver: local